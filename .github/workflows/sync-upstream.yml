name: Sync Upstream Theme

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync One Dark Pro Enhanced
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python sync_upstream.py

      - name: Create sync pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.COMMITTER_TOKEN || github.token }}
          branch: automation/sync-upstream
          delete-branch: true
          commit-message: "chore: sync One Dark Pro Enhanced"
          title: "chore: sync One Dark Pro Enhanced"
          body: |
            Automated synchronization with the latest One Dark Pro Enhanced themes.

            - Updates vendored upstream theme files
            - Records the upstream commit
            - Regenerates all One Dark Pro Blur variants
          add-paths: |
            upstream/themes/**
            upstream/one-dark-pro-enhanced.commit
            themes/one-dark-pro-blur.json
