name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Bump extension version
        id: version
        run: |
          VERSION=$(python scripts/bump_version.py "${{ inputs.version_bump }}")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Regenerate and validate themes
        run: |
          python generate_themes.py
          python scripts/validate_theme.py

      - name: Commit release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension.toml themes/
          git commit -m "chore: release v${VERSION}"
          git push origin HEAD:main

      - name: Create and push tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true

  publish-zed-store:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify store token
        env:
          COMMITTER_TOKEN: ${{ secrets.COMMITTER_TOKEN }}
        run: |
          if [ -z "$COMMITTER_TOKEN" ]; then
            echo "COMMITTER_TOKEN is required for Zed store synchronization."
            exit 1
          fi

      - name: Update Zed extension store
        uses: huacnlee/zed-extension-action@v2
        with:
          extension-name: one-dark-pro-blur-theme
          push-to: callqh/extensions
          tag: v${{ needs.release.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMITTER_TOKEN: ${{ secrets.COMMITTER_TOKEN }}
