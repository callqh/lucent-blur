name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Regenerate themes
        run: python generate_themes.py

      - name: Check generated themes are committed
        run: git diff --exit-code -- themes/one-dark-pro-blur.json

      - name: Validate Zed theme
        run: python scripts/validate_theme.py
